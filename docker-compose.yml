version: '3.8'

services:
  # PostgreSQL 数据库
  database:
    image: postgres:17
    container_name: smart-resume-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_resume}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    networks:
      - smart-resume-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-smart_resume}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MAVEN_OPTS: "-Dmaven.repo.local=/root/.m2/repository"
    container_name: smart-resume-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      SMART_RESUME_DB_URL: jdbc:postgresql://database:5432/${DB_NAME:-smart_resume}
      SMART_RESUME_DB_USERNAME: ${DB_USER:-postgres}
      SMART_RESUME_DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SMART_RESUME_BACKEND_PORT: 8080
      SMART_RESUME_TOKEN_SECRET: ${TOKEN_SECRET:-change-me-in-production}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_logs:/app/logs
      - maven_cache:/root/.m2
    networks:
      - smart-resume-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # React 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        VITE_API_BASE_URL: ""
    container_name: smart-resume-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - smart-resume-network
    depends_on:
      - backend

  # Nginx 反向代理
  nginx:
    image: nginx:1.31
    container_name: smart-resume-nginx
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ENABLE_HTTPS: ${ENABLE_HTTPS:-false}
      NGINX_ENVSUBST_FILTER: "^APP_DOMAIN$"
      NGINX_ENVSUBST_TEMPLATE_DIR: /tmp/nginx-templates
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/templates:/etc/nginx/base-templates:ro
      - ./docker/nginx/optional-templates:/etc/nginx/optional-templates:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./docker/nginx/docker-entrypoint.d/10-select-templates.sh:/docker-entrypoint.d/10-select-templates.sh:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - smart-resume-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  smart-resume-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local
  maven_cache:
    driver: local
  nginx_logs:
    driver: local
