# 开发环境 Docker Compose 配置
# 用于本地开发时只启动数据库等基础服务
version: '3.8'

services:
  # 仅启动数据库
  database:
    image: postgres:17
    container_name: smart-resume-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_resume}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
    driver: local
